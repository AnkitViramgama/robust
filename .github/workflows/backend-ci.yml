name: Backend CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'maven'

    - name: Build with Maven
      working-directory: ./backend
      run: mvn clean install -DskipTests

    - name: Run tests
      working-directory: ./backend
      run: mvn test

    - name: Build Docker image
      if: github.event_name == 'push'
      run: |
        docker build -f docker/backend/Dockerfile -t modular-backend:latest .

    - name: Login to Docker Hub
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Push Docker image
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        docker tag modular-backend:latest ${{ secrets.DOCKER_USERNAME }}/modular-backend:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/modular-backend:latest
