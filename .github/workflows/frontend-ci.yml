name: Frontend CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'frontend/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.0'
        channel: 'stable'

    - name: Install dependencies
      working-directory: ./frontend
      run: flutter pub get

    - name: Analyze code
      working-directory: ./frontend
      run: flutter analyze

    - name: Run tests
      working-directory: ./frontend
      run: flutter test

    - name: Build web
      working-directory: ./frontend
      run: flutter build web --release

    - name: Build Android APK
      if: github.event_name == 'push'
      working-directory: ./frontend
      run: flutter build apk --release

    - name: Build Docker image
      if: github.event_name == 'push'
      run: |
        docker build -f docker/frontend/Dockerfile -t modular-frontend:latest .

    - name: Login to Docker Hub
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Push Docker image
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        docker tag modular-frontend:latest ${{ secrets.DOCKER_USERNAME }}/modular-frontend:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/modular-frontend:latest
